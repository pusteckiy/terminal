[package]
name = "terminal-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "terminal-web"
path = "src/main.rs"

[dependencies]
terminal-core = { path = "../core" }
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "persistence"] }
egui_tiles = { version = "0.17", features = ["serde"] }
ewebsock = "0.8"
serde.workspace = true
serde_json.workspace = true
rust_decimal = "1"
zeroize = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
js-sys = "0.3"
base64 = "0.22"
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Location", "Performance", "Event", "EventTarget", "AudioContext", "AudioContextState", "AudioBuffer", "AudioBufferSourceNode", "AudioDestinationNode", "AudioNode", "AudioParam", "GainNode", "Crypto", "SubtleCrypto", "CryptoKey", "IdbFactory", "IdbDatabase", "IdbRequest", "IdbOpenDbRequest", "IdbTransaction", "IdbTransactionMode", "IdbObjectStore", "Request", "RequestInit", "RequestMode", "RequestCredentials", "Headers", "Response"] }
