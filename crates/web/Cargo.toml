[package]
name = "terminal-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "terminal-web"
path = "src/main.rs"

[dependencies]
terminal-core = { path = "../core" }
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "persistence"] }
egui_tiles = { version = "0.17", features = ["serde"] }
ewebsock = "0.8"
serde.workspace = true
serde_json.workspace = true
rust_decimal = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Location"] }
